openapi: 3.0.3
info:
  title: Family Expenses API
  version: 1.0.0
  description: |
    REST API веб-панели главы семьи: траты всех членов семьи.
    Авторизации нет (по условию задания).

    Суммы передаются JSON-числами с не более чем двумя знаками после запятой,
    даты — строками `YYYY-MM-DD`.
servers:
  - url: /api/v1

tags:
  - name: expenses
  - name: users
  - name: invites
  - name: categories

paths:
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: Список трат с фильтрами
      description: Возвращает страницу трат и итоги (количество и сумму) по всей выборке.
      parameters:
        - $ref: '#/components/parameters/UserIDQuery'
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
        - name: q
          in: query
          description: Поиск по подстроке комментария (без учёта регистра).
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Страница трат
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseList' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Создать трату
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreate' }
      responses:
        '201':
          description: Созданная трата
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /expenses/summary:
    get:
      operationId: getExpenseSummary
      tags: [expenses]
      summary: Суммы по категориям
      parameters:
        - $ref: '#/components/parameters/UserIDQuery'
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
      responses:
        '200':
          description: Траты, сгруппированные по категориям
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /expenses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Получить трату
      responses:
        '200':
          description: Трата
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Изменить трату
      description: Меняет только переданные поля.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseUpdate' }
      responses:
        '200':
          description: Изменённая трата
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Удалить трату
      responses:
        '204': { description: Трата удалена }
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Члены семьи
      description: |
        Все, кто состоял в семье: сначала текущие (глава первым), затем удалённые —
        их траты остаются в истории.
      responses:
        '200':
          description: Список членов семьи
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }

  /users/{telegram_id}:
    delete:
      operationId: removeUser
      tags: [users]
      summary: Удалить из семьи
      description: |
        Бот перестаёт отвечать человеку, его траты остаются. Вернуть можно новым приглашением.
        Главу семьи удалить нельзя.
      parameters:
        - name: telegram_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Удалён }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: Приглашения за последний месяц
      responses:
        '200':
          description: Приглашения, новые первыми
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteList' }
    post:
      operationId: createInvite
      tags: [invites]
      summary: Создать приглашение
      description: |
        Одноразовая ссылка на бота на 7 дней. Ссылка возвращается только здесь:
        в базе хранится лишь хэш кода.
      responses:
        '201':
          description: Приглашение со ссылкой
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invites/{id}:
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Отозвать приглашение
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Отозвано }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Справочник категорий
      responses:
        '200':
          description: Категории с русскими названиями
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryList' }

components:
  parameters:
    UserIDQuery:
      name: user_id
      in: query
      description: Telegram ID члена семьи.
      schema: { type: integer, format: int64 }
    CategoryQuery:
      name: category
      in: query
      schema: { $ref: '#/components/schemas/Category' }
    FromQuery:
      name: from
      in: query
      description: Начало периода включительно.
      schema: { type: string, format: date }
    ToQuery:
      name: to
      in: query
      description: Конец периода включительно.
      schema: { type: string, format: date }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Действие невозможно в текущем состоянии
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Money:
      type: number
      description: Сумма в рублях, не более двух знаков после запятой.
      example: 350.5
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal

    Category:
      type: string
      enum: [food, transport, housing, entertainment, health, shopping, other]
      x-enum-varnames:
        [CategoryFood, CategoryTransport, CategoryHousing, CategoryEntertainment,
         CategoryHealth, CategoryShopping, CategoryOther]

    Expense:
      type: object
      required: [id, user_id, amount, category, spent_at, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, example: 42 }
        user_id: { type: integer, format: int64, description: Telegram ID владельца, example: 123456789 }
        amount: { $ref: '#/components/schemas/Money' }
        category: { $ref: '#/components/schemas/Category' }
        spent_at: { type: string, format: date, example: '2026-10-15' }
        comment: { type: string, example: кофе }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExpenseCreate:
      type: object
      required: [user_id, amount, category]
      properties:
        user_id: { type: integer, format: int64 }
        amount: { $ref: '#/components/schemas/Money' }
        category: { $ref: '#/components/schemas/Category' }
        spent_at:
          type: string
          format: date
          description: По умолчанию — сегодня в таймзоне семьи.
        comment: { type: string, maxLength: 500 }

    ExpenseUpdate:
      type: object
      description: Передаются только изменяемые поля. Пустой `comment` удаляет комментарий.
      properties:
        user_id: { type: integer, format: int64 }
        amount: { $ref: '#/components/schemas/Money' }
        category: { $ref: '#/components/schemas/Category' }
        spent_at: { type: string, format: date }
        comment: { type: string, maxLength: 500 }

    ExpenseList:
      type: object
      required: [items, total, sum]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Expense' }
        total: { type: integer, description: Количество трат во всей выборке }
        sum: { $ref: '#/components/schemas/Money' }

    CategoryTotal:
      type: object
      required: [category, sum, count]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        sum: { $ref: '#/components/schemas/Money' }
        count: { type: integer }

    Summary:
      type: object
      required: [items, sum, count]
      properties:
        items:
          type: array
          description: Категории по убыванию суммы
          items: { $ref: '#/components/schemas/CategoryTotal' }
        sum: { $ref: '#/components/schemas/Money' }
        count: { type: integer }

    User:
      type: object
      required: [telegram_id, first_name, is_head, created_at]
      properties:
        telegram_id: { type: integer, format: int64, example: 123456789 }
        first_name: { type: string, example: Данил }
        username: { type: string, example: rics69 }
        is_head: { type: boolean, description: Глава семьи }
        removed_at:
          type: string
          format: date-time
          description: Когда удалён из семьи; нет — состоит в семье
        created_at: { type: string, format: date-time }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }

    InviteStatus:
      type: string
      enum: [active, used, expired, revoked]
      x-enum-varnames: [InviteActive, InviteUsed, InviteExpired, InviteRevoked]

    Invite:
      type: object
      required: [id, status, created_at, expires_at]
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/InviteStatus' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: string, format: date-time }
        used_by: { type: integer, format: int64, description: Telegram ID присоединившегося }

    CreatedInvite:
      type: object
      required: [id, status, created_at, expires_at, link]
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/InviteStatus' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        link:
          type: string
          example: https://t.me/FamilyExpensesBot?start=Xk9q2LmPz0aB7cD1eF3gHw
          description: Ссылка для члена семьи; открывает бота и добавляет в семью

    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invite' }

    CategoryInfo:
      type: object
      required: [code, label]
      properties:
        code: { $ref: '#/components/schemas/Category' }
        label: { type: string, example: еда }

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CategoryInfo' }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, validation_error, not_found, unknown_user, conflict, internal]
          x-enum-varnames:
            [ErrCodeBadRequest, ErrCodeValidation, ErrCodeNotFound, ErrCodeUnknownUser, ErrCodeConflict, ErrCodeInternal]
        message: { type: string }
        field: { type: string, description: Поле с ошибкой валидации }
