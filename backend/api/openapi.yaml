openapi: 3.0.3
info:
  title: Savepoint API
  version: 2.0.0
  description: |
    REST API mini app «Сейвпоинт»: траты и доходы пользователя, его семья и настройки.

    **Вход.** Каждый запрос несёт заголовок `Authorization: tma <initData>`, где
    `initData` — строка `Telegram.WebApp.initData`. Сервер проверяет её подпись
    токеном бота и берёт пользователя только оттуда. Новый пользователь создаётся
    при первом запросе, как при `/start` в боте. Пока пользователь не принял
    политику данных (`PATCH /me` с `consent: true`), доступны только `/me` и
    справочник категорий, остальное отвечает 403 `consent_required`.

    **Кто что видит.** Глава семьи видит операции всех участников, участник — только
    свои. Создавать, менять и удалять каждый может только свои операции.

    Суммы передаются JSON-числами с не более чем двумя знаками после запятой,
    даты — строками `YYYY-MM-DD`.
servers:
  - url: /api/v1

security:
  - telegram: []

tags:
  - name: me
  - name: operations
  - name: budget
  - name: family
  - name: categories

paths:
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Текущий пользователь и его настройки
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateMe
      tags: [me]
      summary: Изменить настройки или принять политику данных
      description: Меняет только переданные поля.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Пользователь после изменения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: deleteMe
      tags: [me]
      summary: Удалить аккаунт со всеми данными
      description: |
        Удаляет пользователя, его операции, историю диалога и настройки. Семья главы
        распускается: участники продолжают вести расходы сами, со своими операциями.
      responses:
        '204': { description: Аккаунт удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operations:
    get:
      operationId: listOperations
      tags: [operations]
      summary: Траты и доходы с фильтрами
      description: |
        Страница операций, новые первыми, и итоги по всей выборке. Глава видит
        операции всей семьи, участник — только свои.
      parameters:
        - $ref: '#/components/parameters/KindQuery'
        - $ref: '#/components/parameters/UserIDQuery'
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
        - name: q
          in: query
          description: Поиск по подстроке комментария (без учёта регистра).
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Страница операций
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOperation
      tags: [operations]
      summary: Записать трату или доход
      description: Операция записывается на текущего пользователя; вид следует из категории.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationCreate' }
      responses:
        '201':
          description: Созданная операция
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /operations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getOperation
      tags: [operations]
      summary: Получить операцию
      responses:
        '200':
          description: Операция
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateOperation
      tags: [operations]
      summary: Изменить свою операцию
      description: Меняет только переданные поля. Чужие операции, в том числе для главы, — 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationUpdate' }
      responses:
        '200':
          description: Изменённая операция
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteOperation
      tags: [operations]
      summary: Удалить свою операцию
      responses:
        '204': { description: Операция удалена }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /summary:
    get:
      operationId: getSummary
      tags: [operations]
      summary: Траты, доходы и баланс за период
      parameters:
        - $ref: '#/components/parameters/UserIDQuery'
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
      responses:
        '200':
          description: Итоги по видам и категориям
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /timeseries:
    get:
      operationId: getTimeSeries
      tags: [operations]
      summary: Траты или доходы по дням, неделям или месяцам
      description: |
        Сумма за каждый интервал с разбивкой по категориям. Интервалы без операций
        присутствуют с нулём. Без `from` ряд начинается с первой подходящей операции,
        без `to` — заканчивается сегодня. Не больше 400 точек.
      parameters:
        - name: bucket
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Bucket' }
        - name: kind
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Kind' }
        - $ref: '#/components/parameters/UserIDQuery'
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
      responses:
        '200':
          description: Ряд по интервалам
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /savik:
    get:
      operationId: getSavik
      tags: [me]
      summary: Состояние Сейвика
      description: |
        Состояние маскота считается кодом по деньгам пользователя: целям, дневному
        лимиту и операциям текущего месяца. Без целей и лимита состояний два:
        `neutral` и `empty` (траты месяца больше записанных доходов). Фразы и позы
        для состояний живут в mini app.
      responses:
        '200':
          description: Состояние и цифры месяца, из которых оно получилось
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Savik' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /budget:
    get:
      operationId: getBudget
      tags: [budget]
      summary: План и лимит на сегодня
      description: |
        Без плана (дней зарплаты) лимита нет: `plan` и `today` не приходят.
        Лимит считается кодом от состояния на начало дня: доход периода минус
        регулярные платежи, взнос в цели и траты до сегодня, поделённые на дни
        до зарплаты. Перерасход сегодня уменьшает лимит следующих дней.
      responses:
        '200':
          description: План и деньги текущего периода
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /budget/plan:
    put:
      operationId: setPlan
      tags: [budget]
      summary: Задать дни зарплаты и ожидаемый доход
      description: Заменяет план целиком.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '200':
          description: Сохранённый план
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: deletePlan
      tags: [budget]
      summary: Выключить лимит
      description: Цели и регулярные платежи остаются.
      responses:
        '204': { description: План удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /goals:
    get:
      operationId: listGoals
      tags: [budget]
      summary: Цели пользователя
      responses:
        '200':
          description: Цели, старые первыми
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoalList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createGoal
      tags: [budget]
      summary: Поставить цель
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalCreate' }
      responses:
        '201':
          description: Новая цель
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /goals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateGoal
      tags: [budget]
      summary: Изменить цель
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalUpdate' }
      responses:
        '200':
          description: Изменённая цель
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteGoal
      tags: [budget]
      summary: Удалить цель
      description: Пополнения цели удаляются вместе с ней — деньги снова свободны.
      responses:
        '204': { description: Цель удалена }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /goals/{id}/deposits:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: depositToGoal
      tags: [budget]
      summary: Отложить деньги на цель или забрать их
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositCreate' }
      responses:
        '200':
          description: Цель после пополнения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /regular-payments:
    get:
      operationId: listRegularPayments
      tags: [budget]
      summary: Регулярные платежи
      responses:
        '200':
          description: Платежи по дню месяца
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegularPaymentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRegularPayment
      tags: [budget]
      summary: Добавить регулярный платёж
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegularPaymentCreate' }
      responses:
        '201':
          description: Новый платёж
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegularPayment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /regular-payments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateRegularPayment
      tags: [budget]
      summary: Изменить регулярный платёж
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegularPaymentUpdate' }
      responses:
        '200':
          description: Изменённый платёж
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegularPayment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRegularPayment
      tags: [budget]
      summary: Удалить регулярный платёж
      description: Траты, которыми он был оплачен, остаются.
      responses:
        '204': { description: Платёж удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /regular-payments/{id}/pay:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: payRegularPayment
      tags: [budget]
      summary: Отметить платёж оплаченным
      description: Записывает сегодняшнюю трату на сумму платежа, связанную с ним.
      responses:
        '201':
          description: Записанная трата
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /family:
    get:
      operationId: getFamily
      tags: [family]
      summary: Семья пользователя
      description: |
        Участники, глава первым. Приглашения за последний месяц видит только глава,
        участнику приходит пустой список.
      responses:
        '200':
          description: Семья
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Family' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /family/invites:
    post:
      operationId: createInvite
      tags: [family]
      summary: Создать приглашение (глава)
      description: |
        Одноразовая ссылка на бота на 7 дней. Ссылка возвращается только здесь:
        в базе хранится лишь хэш кода.
      responses:
        '201':
          description: Приглашение со ссылкой
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /family/invites/{id}:
    delete:
      operationId: revokeInvite
      tags: [family]
      summary: Отозвать приглашение (глава)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Отозвано }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /family/members/{telegram_id}:
    parameters:
      - name: telegram_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateMember
      tags: [family]
      summary: Изменить настройки участника (глава или сам участник)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: Участник после изменения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeMember
      tags: [family]
      summary: Исключить из семьи (глава)
      description: |
        Человек продолжает вести расходы сам и забирает свои операции: глава перестаёт их видеть.
        Вернуть можно новым приглашением. Себя глава исключить не может.
      responses:
        '204': { description: Исключён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /family/leave:
    post:
      operationId: leaveFamily
      tags: [family]
      summary: Выйти из семьи (участник)
      description: |
        Участник уходит в собственную семью вместе со своими операциями. Глава семьи
        с участниками выйти не может — сначала передаёт роль главы или исключает всех.
      responses:
        '204': { description: Вышел }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /family/head:
    put:
      operationId: transferHead
      tags: [family]
      summary: Передать роль главы участнику (глава)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeadTransfer' }
      responses:
        '204': { description: Роль главы передана }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Справочник категорий
      description: Сначала категории трат, затем доходов, в порядке показа.
      responses:
        '200':
          description: Категории с русскими названиями
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    telegram:
      type: apiKey
      in: header
      name: Authorization
      description: '`tma <initData>` — строка `Telegram.WebApp.initData` целиком.'

  parameters:
    KindQuery:
      name: kind
      in: query
      description: Только траты или только доходы; без параметра — и то и другое.
      schema: { $ref: '#/components/schemas/Kind' }
    UserIDQuery:
      name: user_id
      in: query
      description: Telegram ID члена семьи; для участника имеет смысл только свой.
      schema: { type: integer, format: int64 }
    CategoryQuery:
      name: category
      in: query
      schema: { $ref: '#/components/schemas/Category' }
    FromQuery:
      name: from
      in: query
      description: Начало периода включительно.
      schema: { type: string, format: date }
    ToQuery:
      name: to
      in: query
      description: Конец периода включительно.
      schema: { type: string, format: date }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Нет подписи Telegram, она неверна или устарела — откройте приложение из Telegram заново
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Действие недоступно: `consent_required` — сначала принять политику данных,
        `forbidden` — нужна роль главы или пользователь заблокирован.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Действие невозможно в текущем состоянии
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Money:
      type: number
      description: Сумма в рублях, не более двух знаков после запятой.
      example: 350.5
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal

    Kind:
      type: string
      enum: [expense, income]
      description: Трата или доход
      x-enum-varnames: [KindExpense, KindIncome]

    Category:
      type: string
      description: Категория; её вид (трата или доход) фиксирован.
      enum: [food, transport, housing, entertainment, health, shopping, other,
             salary, freelance, gift, interest, refund, other_income]
      x-enum-varnames:
        [CategoryFood, CategoryTransport, CategoryHousing, CategoryEntertainment,
         CategoryHealth, CategoryShopping, CategoryOther,
         CategorySalary, CategoryFreelance, CategoryGift, CategoryInterest, CategoryRefund, CategoryOtherIncome]

    Me:
      type: object
      required: [telegram_id, first_name, family_id, is_head, weekly_report, effective_timezone, consented, created_at]
      properties:
        telegram_id: { type: integer, format: int64, example: 123456789 }
        first_name: { type: string, example: Данил }
        username: { type: string, example: rics69 }
        family_id: { type: integer, format: int64 }
        is_head: { type: boolean, description: Глава семьи }
        weekly_report: { type: boolean, description: Присылать итоги недели в бот по понедельникам }
        timezone:
          type: string
          example: Asia/Novosibirsk
          description: Выбранный часовой пояс; нет — пользователь не выбирал (mini app может подставить пояс устройства)
        effective_timezone: { type: string, example: Europe/Moscow, description: 'Пояс, по которому считается «сегодня»' }
        consented: { type: boolean, description: Принял политику обработки данных }
        created_at: { type: string, format: date-time }

    MeUpdate:
      type: object
      description: Передаются только изменяемые поля.
      properties:
        timezone: { type: string, description: IANA-имя часового пояса, example: Asia/Novosibirsk }
        weekly_report: { type: boolean }
        consent: { type: boolean, description: '`true` — принять политику данных; отозвать согласие можно только удалением аккаунта' }

    Operation:
      type: object
      required: [id, user_id, kind, amount, category, date, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, example: 42 }
        user_id: { type: integer, format: int64, description: Telegram ID владельца, example: 123456789 }
        kind: { $ref: '#/components/schemas/Kind' }
        amount: { $ref: '#/components/schemas/Money' }
        category: { $ref: '#/components/schemas/Category' }
        date: { type: string, format: date, example: '2026-10-15' }
        comment: { type: string, example: кофе }
        regular_payment_id:
          type: integer
          format: int64
          description: Регулярный платёж, который оплачен этой тратой
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OperationCreate:
      type: object
      required: [amount, category]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        category: { $ref: '#/components/schemas/Category' }
        date:
          type: string
          format: date
          description: По умолчанию — сегодня в часовом поясе пользователя.
        comment: { type: string, maxLength: 500 }

    OperationUpdate:
      type: object
      description: Передаются только изменяемые поля. Пустой `comment` удаляет комментарий.
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        category: { $ref: '#/components/schemas/Category' }
        date: { type: string, format: date }
        comment: { type: string, maxLength: 500 }

    OperationList:
      type: object
      required: [items, total, expense_sum, income_sum]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Operation' }
        total: { type: integer, description: Количество операций во всей выборке }
        expense_sum: { $ref: '#/components/schemas/Money' }
        income_sum: { $ref: '#/components/schemas/Money' }

    CategoryTotal:
      type: object
      required: [category, sum, count]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        sum: { $ref: '#/components/schemas/Money' }
        count: { type: integer }

    Totals:
      type: object
      required: [sum, count, categories]
      properties:
        sum: { $ref: '#/components/schemas/Money' }
        count: { type: integer }
        categories:
          type: array
          description: Категории по убыванию суммы
          items: { $ref: '#/components/schemas/CategoryTotal' }

    Summary:
      type: object
      required: [expense, income, balance]
      properties:
        expense: { $ref: '#/components/schemas/Totals' }
        income: { $ref: '#/components/schemas/Totals' }
        balance: { $ref: '#/components/schemas/Money' }

    Bucket:
      type: string
      enum: [day, week, month]
      description: Интервал; недели начинаются с понедельника
      x-enum-varnames: [BucketDay, BucketWeek, BucketMonth]

    TimePoint:
      type: object
      required: [start, sum, count, categories]
      properties:
        start: { type: string, format: date, description: Первый день интервала }
        sum: { $ref: '#/components/schemas/Money' }
        count: { type: integer }
        categories:
          type: array
          description: Категории по убыванию суммы
          items: { $ref: '#/components/schemas/CategoryTotal' }

    TimeSeries:
      type: object
      required: [bucket, kind, items]
      properties:
        bucket: { $ref: '#/components/schemas/Bucket' }
        kind: { $ref: '#/components/schemas/Kind' }
        items:
          type: array
          items: { $ref: '#/components/schemas/TimePoint' }

    SavikState:
      type: string
      enum: [neutral, full, empty, hungry, fed]
      description: |
        Проверяются по порядку: `full` — цель достигнута за последние 7 дней;
        `empty` — до зарплаты ничего не осталось (без плана — траты месяца больше
        записанных доходов); `hungry` — сегодня потрачено больше лимита; `fed` —
        какая-то цель накоплена на 80%; `neutral` — всё остальное.
      x-enum-varnames: [SavikNeutral, SavikFull, SavikEmpty, SavikHungry, SavikFed]

    Savik:
      type: object
      required: [state, month]
      properties:
        state: { $ref: '#/components/schemas/SavikState' }
        month: { $ref: '#/components/schemas/SavikMonth' }

    SavikMonth:
      type: object
      description: Свои операции пользователя с начала месяца по сегодня
      required: [from, to, expense, income, balance]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, description: Сегодня }
        expense: { $ref: '#/components/schemas/Money' }
        income: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }

    Plan:
      type: object
      required: [paydays, reminder_hour, reminders, updated_at]
      properties:
        paydays:
          type: array
          description: Один или два дня месяца по возрастанию; 31 в коротком месяце — последний день
          items: { type: integer, minimum: 1, maximum: 31 }
          example: [5, 20]
        expected_income: { $ref: '#/components/schemas/Money' }
        goal_contribution: { $ref: '#/components/schemas/Money' }
        reminder_hour: { type: integer, minimum: 0, maximum: 23, description: Час ежедневного напоминания по поясу пользователя }
        reminders: { type: boolean, description: Присылать ежедневное напоминание о лимите }
        updated_at: { type: string, format: date-time }

    PlanInput:
      type: object
      required: [paydays]
      properties:
        paydays:
          type: array
          items: { type: integer, minimum: 1, maximum: 31 }
          minItems: 1
          maxItems: 2
        expected_income:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Доход за период; без него считаются только записанные доходы
        goal_contribution:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Сколько откладывать на цели за период
        reminder_hour: { type: integer, minimum: 0, maximum: 23, default: 9 }
        reminders: { type: boolean, default: true }

    BudgetOverview:
      type: object
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        today: { $ref: '#/components/schemas/BudgetToday' }

    BudgetToday:
      type: object
      required: [ready, period_start, next_payday, days_left, income, income_expected, payments, savings,
                 spent, spent_today, available, remaining, limit, left, upcoming]
      properties:
        ready: { type: boolean, description: Нет записанного или ожидаемого дохода — лимит не посчитать }
        period_start: { type: string, format: date, description: Последний день зарплаты }
        next_payday: { type: string, format: date }
        days_left: { type: integer, description: 'Дней до зарплаты, включая сегодня' }
        income: { $ref: '#/components/schemas/Money' }
        income_expected: { type: boolean, description: 'Доход взят из плана: записано меньше' }
        payments: { $ref: '#/components/schemas/Money' }
        savings: { $ref: '#/components/schemas/Money' }
        spent: { $ref: '#/components/schemas/Money' }
        spent_today: { $ref: '#/components/schemas/Money' }
        available: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money' }
        limit: { $ref: '#/components/schemas/Money' }
        left: { $ref: '#/components/schemas/Money' }
        upcoming:
          type: array
          description: Неоплаченные регулярные платежи до зарплаты
          items: { $ref: '#/components/schemas/UpcomingPayment' }

    UpcomingPayment:
      type: object
      required: [id, title, amount, date]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, example: Аренда }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }

    Goal:
      type: object
      required: [id, title, target, saved, left, created_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, example: Отпуск }
        target: { $ref: '#/components/schemas/Money' }
        saved: { $ref: '#/components/schemas/Money' }
        left: { $ref: '#/components/schemas/Money' }
        deadline: { type: string, format: date }
        achieved_on: { type: string, format: date, description: Когда накоплена вся сумма }
        created_at: { type: string, format: date-time }

    GoalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Goal' }

    GoalCreate:
      type: object
      required: [title, target]
      properties:
        title: { type: string, maxLength: 100 }
        target: { $ref: '#/components/schemas/Money' }
        deadline: { type: string, format: date }

    GoalUpdate:
      type: object
      description: Передаются только изменяемые поля.
      properties:
        title: { type: string, maxLength: 100 }
        target: { $ref: '#/components/schemas/Money' }
        deadline: { type: string, format: date }
        clear_deadline: { type: boolean, description: '`true` — убрать срок' }

    DepositCreate:
      type: object
      required: [amount]
      properties:
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Сколько отложить; отрицательная сумма забирает деньги из цели
        date: { type: string, format: date, description: По умолчанию — сегодня }

    RegularPayment:
      type: object
      required: [id, title, amount, day, category, due_date, created_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, example: Аренда }
        amount: { $ref: '#/components/schemas/Money' }
        day: { type: integer, minimum: 1, maximum: 31 }
        category: { $ref: '#/components/schemas/Category' }
        due_date:
          type: string
          format: date
          description: Ближайшая дата оплаты; в прошлом — платёж просрочен
        last_paid_on: { type: string, format: date }
        created_at: { type: string, format: date-time }

    RegularPaymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegularPayment' }

    RegularPaymentCreate:
      type: object
      required: [title, amount, day]
      properties:
        title: { type: string, maxLength: 100 }
        amount: { $ref: '#/components/schemas/Money' }
        day: { type: integer, minimum: 1, maximum: 31 }
        category:
          allOf: [{ $ref: '#/components/schemas/Category' }]
          description: Категория трат; по умолчанию other

    RegularPaymentUpdate:
      type: object
      description: Передаются только изменяемые поля.
      properties:
        title: { type: string, maxLength: 100 }
        amount: { $ref: '#/components/schemas/Money' }
        day: { type: integer, minimum: 1, maximum: 31 }
        category: { $ref: '#/components/schemas/Category' }

    Member:
      type: object
      required: [telegram_id, first_name, is_head, weekly_report, created_at]
      properties:
        telegram_id: { type: integer, format: int64, example: 123456789 }
        first_name: { type: string, example: Данил }
        username: { type: string, example: rics69 }
        is_head: { type: boolean, description: Глава семьи }
        weekly_report: { type: boolean, description: Присылать итоги недели в бот по понедельникам }
        created_at: { type: string, format: date-time }

    MemberUpdate:
      type: object
      required: [weekly_report]
      properties:
        weekly_report: { type: boolean }

    Family:
      type: object
      required: [id, members, invites]
      properties:
        id: { type: integer, format: int64 }
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        invites:
          type: array
          description: Приглашения за последний месяц, новые первыми; только для главы
          items: { $ref: '#/components/schemas/Invite' }

    HeadTransfer:
      type: object
      required: [telegram_id]
      properties:
        telegram_id: { type: integer, format: int64, description: 'Участник, который станет главой' }

    InviteStatus:
      type: string
      enum: [active, used, expired, revoked]
      x-enum-varnames: [InviteActive, InviteUsed, InviteExpired, InviteRevoked]

    Invite:
      type: object
      required: [id, status, created_at, expires_at]
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/InviteStatus' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: string, format: date-time }
        used_by: { type: integer, format: int64, description: Telegram ID присоединившегося }

    CreatedInvite:
      type: object
      required: [id, status, created_at, expires_at, link]
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/InviteStatus' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        link:
          type: string
          example: https://t.me/SavepointBot?start=Xk9q2LmPz0aB7cD1eF3gHw
          description: Ссылка для члена семьи; открывает бота и предлагает вступить

    CategoryInfo:
      type: object
      required: [code, kind, label]
      properties:
        code: { $ref: '#/components/schemas/Category' }
        kind: { $ref: '#/components/schemas/Kind' }
        label: { type: string, example: еда }

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CategoryInfo' }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, validation_error, not_found, unauthorized, consent_required, forbidden, conflict, internal]
          x-enum-varnames:
            [ErrCodeBadRequest, ErrCodeValidation, ErrCodeNotFound, ErrCodeUnauthorized, ErrCodeConsentRequired,
             ErrCodeForbidden, ErrCodeConflict, ErrCodeInternal]
        message: { type: string }
        field: { type: string, description: Поле с ошибкой валидации }
