# Челлендж — один файл в этой папке, код менять не нужно.
#
# access: free — для всех, club — только для клуба (пока закрыт).
# starts_on: пусто — старт сразу после записи; дата — общий поток, запись
# закрывается через 3 дня после старта.
# check дня: manual — кнопка «Сделал», auto — правило как у квестов.
slug: no-spend-week
title: Неделя осознанных трат
description: Семь дней, по одному простому заданию в день. Цель — увидеть, куда уходят деньги, и отложить первую сумму.
access: free
xp_finish: 50
days:
  - title: Всё записано
    task: Запишите сегодня все траты, минимум три.
    check: auto
    rule: { type: operations_logged, count: 3 }
    xp: 10
  - title: Подписки
    task: Откройте список подписок и отмените одну ненужную.
    check: manual
    xp: 10
  - title: Первый взнос
    task: Отложите на цель любую сумму.
    check: auto
    rule: { type: goal_contribution }
    xp: 10
  - title: Без доставки
    task: Сегодня без доставки еды, готовим или берём с собой.
    check: manual
    xp: 10
  - title: Лимит
    task: Посмотрите, сколько можно тратить в день, и уложитесь в это сегодня.
    check: manual
    xp: 10
  - title: Спонтанные покупки
    task: Вспомните три последние покупки, о которых пожалели. Сколько это в сумме?
    check: manual
    xp: 10
  - title: План на месяц
    task: Назначьте день, когда будете откладывать, и поставьте напоминание.
    check: manual
    xp: 10
