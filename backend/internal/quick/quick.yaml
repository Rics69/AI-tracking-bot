# Словарь быстрой записи: «слово сумма» пишется сразу, без нейросети и токенов.
# Файл вшивается в бинарь: после правки пересобрать бота.
#
# Слова сравниваются целиком, без учёта регистра, ё = е. Чего нет в словаре,
# то разбирает агент, поэтому сомнительные слова («мама», «перевод», «долг») сюда
# не добавляйте: лучше потратить токены, чем записать не туда.
# Ключи — категории из ledger, одно слово — только в одной категории.

