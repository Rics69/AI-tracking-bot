# Mini app. app_button — подпись кнопки меню слева от поля ввода и кнопки в /app.
app_button: Открыть
app_open: Траты, доходы, графики и цели — в приложении.
app_missing: Приложение скоро появится. Пока записывайте траты здесь, в чате.

# Утреннее сообщение: приходит в выбранный час тем, у кого есть план, цель или
# регулярный платёж. Фраза о лимите выбирается случайно по состоянию денег.
# {limit} — лимит на сегодня, {left} — сколько осталось до зарплаты,
# {days} — «13 дней», {payday} — «5 ноября».
# Состояния: neutral — всё спокойно, full — цель достигнута на этой неделе,
# empty — до зарплаты ничего не осталось, hungry — вчера потрачено больше
# лимита, fed — цель накоплена на 80%.
reminders:
  neutral:
    - "Сегодня можно потратить {limit}. До зарплаты {days}."
    - "Лимит на сегодня — {limit}. Зарплата {payday}."
  full:
    - "Цель накоплена! На сегодня можно потратить {limit}."
  empty:
    - "До зарплаты ({payday}) свободных денег не осталось."
    - "Лимит на сегодня — 0 ₽: всё распределено до {payday}."
  hungry:
    - "Сегодня можно потратить {limit}. Вчера вышли за лимит, поэтому он меньше."
  fed:
    - "Сегодня можно потратить {limit}. Цель почти накоплена."
reminder_no_income: "Лимит на сегодня не посчитать: с последней зарплаты не записан доход. Напишите, например, «зарплата 80000»."
# За день до регулярного платежа, отдельной строкой. {title} — название, {amount} — сумма.
reminder_payment: "Завтра {title} — {amount}."
# {title} — название цели, {percent} — накоплено в процентах, {saved}, {target} — суммы.
reminder_goal: "Цель «{title}»: {percent}%, {saved} из {target}."
# {rates} — курсы, {date} — день курса.
reminder_rates: "{rates}, курс ЦБ на {date}"
# Одно сообщение после 30 дней без активности, дальше тишина.
comeback: "Давно не виделись. Вернуться к учёту? Напишите, например: кофе 350."
comeback_goal: "Вернуться к цели «{title}»? Накоплено {percent}%."
# Прогресс цели: на 25, 50 и 75%, и отдельно при достижении.
goal_progress: "Цель «{title}»: {percent}%, {saved} из {target}."
goal_reached: "Цель «{title}» накоплена: {target}."

# Только для владельца (ADMIN_TELEGRAM_ID). {id} — Telegram ID, {count} — сколько ответов подряд упало.
admin_ban_usage: "Укажите Telegram ID: /ban 123456789 или /unban 123456789"
admin_banned: "Пользователь {id} заблокирован: бот и приложение ему не отвечают. Снять — /unban {id}"
admin_unbanned: Пользователь {id} разблокирован.
admin_unknown_user: Пользователя {id} нет в базе.
admin_self: Себя заблокировать нельзя.
llm_alert: |-
  GigaChat не отвечает: {count} ответов агента подряд с ошибкой.
  Проверьте ключ и лимиты GigaChat и логи бота: docker compose logs --since 1h bot
# {percent} — сколько пакета израсходовано, {spent}, {total}, {left} — токены.
package_alert: "Пакет токенов GigaChat израсходован на {percent}%: {spent} из {total}, осталось {left}. Подробнее — /stats."
package_out: |-
  Пакет токенов GigaChat закончился: {spent} из {total}.
  Агент выключен, работают только короткие записи. Когда подключите новый тариф, обновите LLM_TOKEN_PACKAGE и LLM_PACKAGE_SINCE в .env на сервере.

# Владелец. {slug}, {participants}, {finished}, {worst} — день с самым большим оттоком;
# {new}, {total} — заявки.
admin_challenge: |-
  Челлендж {slug}
  Участников: {participants}, дошли до конца: {finished}
  Больше всего отвалилось на дне: {worst}
admin_challenge_usage: "Укажите челлендж: /challenge {slugs}"
admin_challenge_unknown: Такого челленджа нет.
admin_reviews: "Заявки на разбор: новых {new}, всего {total}. В файле нет имён и Telegram ID."
admin_no_reviews: Заявок на разбор пока нет.
admin_review_new: Новая заявка на разбор. Посмотреть — /reviews

