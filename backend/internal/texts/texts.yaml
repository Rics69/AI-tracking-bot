# /privacy. {link} — ссылка на полный текст (если задана PRIVACY_URL).
privacy: |-
  Как хранятся данные

  • Храним: ваши траты и доходы, имя и ник в Telegram, настройки и историю переписки за последнюю неделю.
  • Сообщения обрабатывает нейросеть GigaChat (Сбер), чтобы понять, что записать.
  • Никому не передаём и не показываем, кроме главы семьи, если вы в неё вступили: он видит ваши траты и доходы.
  • Удалить всё можно командой /delete_me.
privacy_link: "Полный текст: {link}"

# Удаление аккаунта.
delete_confirm: Удалить аккаунт? Удалятся все ваши траты и доходы, история переписки и настройки. Это нельзя отменить.
delete_confirm_head: |-
  Удалить аккаунт? Удалятся все ваши траты и доходы, история переписки и настройки. Это нельзя отменить.

  Семья будет распущена: участники сохранят свои траты и продолжат вести расходы сами.
delete_yes: Удалить всё
deleted: Аккаунт удалён. Если захотите вернуться — просто напишите /start.

