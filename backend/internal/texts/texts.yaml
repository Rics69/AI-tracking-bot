# Семья. {head} — имя главы семьи, {name} — имя участника.
invitation: |-
  {head} приглашает вас вести расходы вместе.

  Глава семьи будет видеть все ваши траты и доходы, в том числе уже записанные. Вы будете видеть только свои. Выйти можно в любой момент — /family.
join_button: Вступить
decline_button: Не сейчас
joined: Вы в семье {head}. Записывайте траты как обычно.
member_joined: "{name} теперь в вашей семье."
declined: Хорошо, вы по-прежнему ведёте расходы сами.
invite_invalid: "Это приглашение недействительно: оно истекло, отозвано или уже использовано. Попросите новую ссылку."
already_member: Вы уже в этой семье.
head_has_members: Вы глава семьи, в которой есть участники. Чтобы вступить в другую, сначала исключите их в /family.

family_alone: |-
  Пока вы ведёте расходы сами.

  Чтобы вести учёт вместе, создайте ссылку-приглашение и отправьте её человеку. Вы будете видеть его траты, он — только свои.
# {members} — список участников, по одному на строке.
family_head: |-
  Ваша семья:
  {members}

  Вы видите траты всех участников. Чтобы добавить человека, создайте ссылку-приглашение.
