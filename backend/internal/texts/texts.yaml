# Тексты бота. Правьте свободно: файл вшивается в бинарь при сборке,
# после правки — пересобрать бота (make up). Пустых значений быть не должно.
#
# Подстановки в фигурных скобках ({name}, {link} ...) заполняет код —
# их можно переставлять, но не переименовывать.
# Разметки нет: текст уходит в Telegram как есть.
# Если в однострочном тексте есть «: » или он начинается с «{», возьмите его в кавычки.
# Многострочные тексты пишутся после «|-» с отступом в два пробела.

# Первое сообщение: согласие на обработку данных. {policy} — ссылка или /privacy.
consent: |-
  Привет! Я записываю траты из обычных сообщений и считаю, куда уходят деньги.

  Перед началом: ваши траты хранятся у нас, а сообщения обрабатывает нейросеть GigaChat (Сбер). Подробнее — {policy}.
consent_button: Принимаю

# После согласия и на /start.
welcome: |-
  Готово! Пишите траты обычным текстом:
  • кофе 350
  • такси 1200 вчера
  • сколько потратил за неделю

  Остальное — в меню команд слева от поля ввода.

help: |-
  Я записываю расходы. Пишите обычным текстом:
  • кофе 350
  • такси 1200 вчера
  • сколько потратил на еду в этом месяце
  • покажи траты за неделю
  • последнее было не 350, а 450
  • удали такси

  /family — семья: вести расходы вместе
  /settings — итоги недели и часовой пояс
  /privacy — как хранятся данные
  /feedback — написать разработчику
  /delete_me — удалить аккаунт

not_text: "Я понимаю только текстовые сообщения. Например: «кофе 350»."
too_long: "Слишком длинное сообщение. Напишите трату коротко, например: «кофе 350»."
private: Я работаю только в личных сообщениях — напишите мне напрямую.
failure: Что-то пошло не так, попробуйте ещё раз через минуту.
blocked: Доступ к боту ограничен.
limit_reached: На сегодня лимит сообщений исчерпан — продолжим завтра.
cancelled: Отменено.

# Семья. {head} — имя главы семьи, {name} — имя участника.
invitation: |-
  {head} приглашает вас вести расходы вместе.

  Глава семьи будет видеть все ваши траты, в том числе уже записанные. Вы будете видеть только свои. Выйти можно в любой момент — /family.
join_button: Вступить
decline_button: Не сейчас
joined: Вы в семье {head}. Записывайте траты как обычно.
member_joined: "{name} теперь в вашей семье."
declined: Хорошо, вы по-прежнему ведёте расходы сами.
invite_invalid: "Это приглашение недействительно: оно истекло, отозвано или уже использовано. Попросите новую ссылку."
already_member: Вы уже в этой семье.
head_has_members: Вы глава семьи, в которой есть участники. Чтобы вступить в другую, сначала исключите их в /family.

family_alone: |-
  Пока вы ведёте расходы сами.

  Чтобы вести учёт вместе, создайте ссылку-приглашение и отправьте её человеку. Вы будете видеть его траты, он — только свои.
# {members} — список участников, по одному на строке.
family_head: |-
  Ваша семья:
  {members}

  Вы видите траты всех участников. Чтобы добавить человека, создайте ссылку-приглашение.
family_member: |-
  Вы в семье {head}:
  {members}

  Глава видит ваши траты, вы — только свои.
invite_button: Создать ссылку-приглашение
# {link} — одноразовая ссылка, {days} — сколько дней она действует.
invite_created: |-
  Отправьте эту ссылку тому, с кем хотите вести расходы. Она одноразовая и действует {days} дней:

  {link}
leave_button: Выйти из семьи
leave_confirm: Выйти из семьи {head}? Ваши траты останутся с вами, глава перестанет их видеть.
leave_yes: Выйти
left: Вы вышли из семьи и снова ведёте расходы сами.
member_left: "{name} теперь ведёт расходы отдельно."
kick_button: Исключить {name}
kick_confirm: Исключить {name} из семьи? Траты останутся у этого человека, вы перестанете их видеть.
kick_yes: Исключить
kicked: "{name} больше не в семье."
you_were_removed: Вас исключили из семьи. Ваши траты остались с вами, теперь вы ведёте расходы сами.
no_button: Отмена

# Настройки. {weekly} — weekly_on / weekly_off, {timezone} — название пояса.
settings: |-
  Настройки

  Итоги недели по понедельникам: {weekly}
  Часовой пояс: {timezone}
weekly_on: включены
weekly_off: выключены
weekly_button_on: Выключить итоги недели
weekly_button_off: Включить итоги недели
timezone_button: Сменить часовой пояс
timezone_pick: Выберите часовой пояс — от него зависит, какой день считается «сегодня».
back_button: Назад

# /privacy. {link} — ссылка на полный текст (если задана PRIVACY_URL).
privacy: |-
  Как хранятся данные

  • Храним: ваши траты, имя и ник в Telegram, настройки и историю переписки за последнюю неделю.
  • Сообщения обрабатывает нейросеть GigaChat (Сбер), чтобы понять, что записать.
  • Никому не передаём и не показываем, кроме главы семьи, если вы в неё вступили.
  • Удалить всё можно командой /delete_me.
privacy_link: "Полный текст: {link}"

# Удаление аккаунта.
delete_confirm: Удалить аккаунт? Удалятся все ваши траты, история переписки и настройки. Это нельзя отменить.
delete_confirm_head: |-
  Удалить аккаунт? Удалятся все ваши траты, история переписки и настройки. Это нельзя отменить.

  Семья будет распущена: участники сохранят свои траты и продолжат вести расходы сами.
delete_yes: Удалить всё
deleted: Аккаунт удалён. Если захотите вернуться — просто напишите /start.

# /feedback. {name}, {username}, {id}, {text} — для сообщения разработчику.
feedback_usage: "Напишите отзыв сразу после команды, например: /feedback хочу видеть траты по неделям"
feedback_thanks: Спасибо! Сообщение передано разработчику.
feedback_to_admin: |-
  Отзыв от {name} ({username}, id {id}):
  {text}

# Меню команд (кнопка «/» в Telegram).
command_start: Начать
command_family: Семья
command_settings: Настройки
command_privacy: Как хранятся данные
command_feedback: Написать разработчику
command_delete_me: Удалить аккаунт
command_help: Помощь
