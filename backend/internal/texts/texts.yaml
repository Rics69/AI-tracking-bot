# Тексты бота. Правьте свободно: файл вшивается в бинарь при сборке,
# после правки — пересобрать бота (make up). Пустых значений быть не должно.
#
# Подстановки в фигурных скобках ({name}, {link} ...) заполняет код —
# их можно переставлять, но не переименовывать.
# Разметки нет: текст уходит в Telegram как есть.
# Если в однострочном тексте есть «: » или он начинается с «{», возьмите его в кавычки.
# Многострочные тексты пишутся после «|-» с отступом в два пробела.

# Первое сообщение: согласие на обработку данных. {policy} — ссылка или /privacy.
consent: |-
  Привет! Я записываю траты и доходы из обычных сообщений и считаю, куда уходят деньги.

  Перед началом: ваши траты и доходы хранятся у нас, а сообщения обрабатывает нейросеть GigaChat (Сбер). Подробнее — {policy}.
consent_button: Принимаю

# После согласия и на /start.
welcome: |-
  Готово! Пишите траты и доходы обычным текстом:
  • кофе 350
  • такси 1200 вчера
  • зарплата 80000
  • сколько осталось в этом месяце

  Остальное — в меню команд слева от поля ввода.

help: |-
  Я записываю траты и доходы. Пишите обычным текстом:
  • кофе 350
  • такси 1200 вчера
  • зарплата 80000, кэшбэк 350
  • сколько потратил на еду в этом месяце
  • сколько осталось в этом месяце
  • покажи траты за неделю
  • последнее было не 350, а 450
  • удали такси

  Если захотите — дневной лимит и цели:
  • зарплата 5 и 20 числа
  • аренда 45000 каждое 1 число
  • хочу накопить 100к на отпуск
  • сколько можно потратить сегодня

  /dream — посчитать, сколько откладывать на цель
  /quests — квесты, опыт и серия
  /level — уровень
  /challenge — челленджи
  /review — заявка на разбор в ролике
  /app — открыть приложение
  /family — семья: вести расходы вместе
  /settings — итоги недели и часовой пояс
  /privacy — как хранятся данные
  /feedback — написать разработчику
  /delete_me — удалить аккаунт

not_text: "Я понимаю только текстовые сообщения. Например: «кофе 350»."
too_long: "Слишком длинное сообщение. Напишите трату коротко, например: «кофе 350»."
private: Я работаю только в личных сообщениях — напишите мне напрямую.
failure: Что-то пошло не так, попробуйте ещё раз через минуту.
blocked: Доступ к боту ограничен.
limit_reached: На сегодня лимит сообщений исчерпан — продолжим завтра.
cancelled: Отменено.

