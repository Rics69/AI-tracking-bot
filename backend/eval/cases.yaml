# Eval cases for the agent (run with `go run ./cmd/eval`).
#
# Each case is a dialog of one user on a fresh store. Every case also contains
# another member's expense «ресторан Пушкин»: it must never change or appear in replies.
# An expected operation may give `kind` (expense/income) instead of a category
# when several categories are fine.
#
# Dates are relative to the day of the run: today, yesterday, -N, a weekday
# (the most recent one), day:N. Comments match by substring, case-insensitively.

# ── After a quick record ───────────────────────────────────────────────────
# `quick` is recorded without the LLM and stays in the history as plain text:
# the agent must still see the record and must not answer as if it had saved
# something itself.

- name: быстрая запись, правка суммы
  tags: [quick, edit]
  quick: ["кофе 350"]
  turns: ["ой, не 350, а 450"]
  expect:
    tools: [find_operations, update_operation]
    operations:
      - { amount: 450, category: food, date: today, comment: кофе }

- name: быстрая запись, правка даты
  tags: [quick, edit, dates]
  quick: ["такси 640"]
  turns: ["это было вчера"]
  expect:
    operations:
      - { amount: 640, category: transport, date: yesterday, comment: такси }

- name: быстрая запись, отмена
  tags: [quick, delete]
  quick: ["обед 450"]
  turns: ["отмени"]
  expect:
    tools: [delete_operation]
    operations: []

- name: быстрая запись, смена категории
  tags: [quick, edit]
  quick: ["кроссовки 7.5к"]
  turns: ["это подарок сестре, поменяй комментарий на подарок"]
  expect:
    operations:
      - { amount: 7500, kind: expense, date: today, comment: подарок }

- name: после быстрой записи агент сам вызывает инструмент
  tags: [quick, add]
  quick: ["кофе 350", "такси 640"]
  turns: ["купил хлеб за 80"]
  expect:
    tools: [add_expense]
    operations:
      - { amount: 350, category: food, date: today, comment: кофе }
      - { amount: 640, category: transport, date: today, comment: такси }
      - { amount: 80, category: food, date: today, comment: хлеб }

- name: быстрая запись видна в сводке
  tags: [quick, summary]
  quick: ["кофе 350", "зарплата 80000"]
  turns: ["сколько у меня осталось в этом месяце?"]
  expect:
    tools: [get_summary]
    reply_contains: ["79650"]

# ── Currencies, accounts, tasks ────────────────────────────────────────────
# Rates of the eval: 1 USD = 100 ₽, 1 EUR = 110 ₽.

- name: трата в долларах
  tags: [money]
  turns: ["кофе 5 долларов"]
  expect:
    operations:
      - { amount: 500, category: food, date: today, comment: кофе }
    reply_contains: ["500"]

- name: трата в евро вчера
  tags: [money, dates]
  turns: ["такси 10 евро вчера"]
  expect:
    operations:
      - { amount: 1100, category: transport, date: yesterday, comment: такси }

- name: оплата наличкой
  tags: [money]
  accounts: ["Наличные"]
  turns: ["кофе 350, оплатил наличкой"]
  expect:
    tools: [add_expense]
    operations:
      - { amount: 350, category: food, date: today, comment: кофе }

- name: перевод между счетами не трата
  tags: [money]
  accounts: ["Накопительный"]
  turns: ["перевёл с основного на накопительный 5000"]
  expect:
    tools: [add_transfer]
    transfers: 1
    unchanged: true

- name: перевод человеку это трата
  tags: [money]
  accounts: ["Накопительный"]
  turns: ["перевёл маме 2000"]
  expect:
    tools: [add_expense]
    transfers: 0

- name: задача на завтра
  tags: [tasks]
  turns: ["напомни завтра оплатить интернет"]
  expect:
    tools: [add_task]
    tasks: ["интернет"]
    unchanged: true

- name: задача не запрещена как будущая трата
  tags: [tasks]
  turns: ["запланируй на понедельник позвонить в банк"]
  expect:
    tools: [add_task]
    tasks: ["банк"]

- name: что запланировано
  tags: [tasks]
  turns: ["напомни завтра оплатить интернет", "что у меня запланировано на неделю?"]
  expect:
    tools: [list_tasks]
    reply_contains: ["интернет"]

