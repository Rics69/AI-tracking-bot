# ── Debts ──────────────────────────────────────────────────────────────────

- name: новый долг
  tags: [debts]
  turns: ["у меня кредитка 150000 под 29,9, минимальный платёж 4500"]
  expect:
    tools: [add_debt]
    unchanged: true
    debts:
      - { name: кредитка, balance: 150000 }

- name: платёж по долгу не задваивается
  tags: [debts]
  debts:
    - { name: Кредитка, balance: 150000, rate: 29.9, min_payment: 4500 }
  turns: ["заплатил по кредитке 5000"]
  expect:
    tools: [add_debt_payment]
    operations:
      - { amount: 5000, kind: expense, date: today, comment: кредитка }
    debts:
      - { name: кредитка, balance: 145000 }

- name: план погашения считает код
  tags: [debts]
  debts:
    - { name: Кредитка, balance: 150000, rate: 29.9, min_payment: 4500 }
    - { name: Кредит, balance: 300000, rate: 17.5, min_payment: 9000 }
  turns: ["что будет, если платить на 10000 больше?"]
  expect:
    tools: [get_debts]
    unchanged: true

- name: сколько я должен
  tags: [debts]
  debts:
    - { name: Кредитка, balance: 150000, rate: 29.9, min_payment: 4500 }
  turns: ["сколько я должен?"]
  expect:
    tools: [get_debts]
    reply_contains: ["150000"]

