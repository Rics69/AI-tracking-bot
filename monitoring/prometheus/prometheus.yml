# Prometheus pulls metrics from the services every 15 seconds over the
# internal compose network (port 9091 is not published to the host).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9091"]
  - job_name: bot
    static_configs:
      - targets: ["bot:9091"]
